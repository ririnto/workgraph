schema_version: "1.1"
name: delivery-decisions
description: Distinguish publication authority, queued merges, and verified delivery.
runs: 1
execution:
  max_turns: 12
  timeout_seconds: 240
  allowed_tools:
    - Read
  prompt: |-
    Use the bundled Delivery guidance to assess these cases. Perform no repository operations.
    A user authorizes publishing a PR. Checks and review pass. The integration owner has merge access.
    Later, the user authorizes a merge into main. The PR enters the queue and remains open.
    A competing merge changes a shared consumer. Once the updated candidate lands, the issue requires a specific exit code on main.
    State what the owner may do at each point, which evidence needs refreshing, and when to close the issue.
graders:
  - name: delivery-authority-and-evidence
    type: llm
    focus: trace
    criteria: |-
      Publication authority ends with the posted PR. The owner waits for merge authority before queueing or merging.
      Queue enrollment leaves integration pending. Update the affected candidate and check the shared consumer while retaining applicable evidence.
      Confirm the merged revision on main and establish the required exit behavior before closing the issue.
      The response claims no actual publication, merge, test execution, or closure.
