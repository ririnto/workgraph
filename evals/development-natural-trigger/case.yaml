schema_version: "1.1"
name: development-natural-trigger
description: Fix a source bug directly when a GitHub Actions workflow is only its context.
runs: 1
execution:
  max_turns: 12
  timeout_seconds: 240
  allowed_tools:
    - Read
    - Skill
    - Agent
    - Workflow
  prompt: |-
    A Python helper in my GitHub Actions workflow shares tags across calls.
    Return the corrected function. Preserve in-place updates for a supplied list, including an empty list.
    Work from this snippet without editing files or running commands.
    def add_tag(tag, tags=[]):
        tags.append(tag)
        return tags
graders:
  - name: direct-correction
    type: llm
    focus: trace
    criteria: |-
      The bundled Development skill is read or is already fully loaded.
      Main handles the request directly without invoking Agent or Workflow.
      Calls without a list get independent results. A supplied list is mutated and returned by identity.
      The response makes no claim of running code or editing files.
