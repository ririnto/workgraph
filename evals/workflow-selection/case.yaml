schema_version: "1.1"
name: workflow-selection
description: Verify an initial one-phase Workflow with expected reconciliation and cache-preserving continuation.
execution:
  runs: 1
  max_turns: 25
  timeout_seconds: 480
  allowed_tools:
    - Agent
    - Workflow
    - Skill(workgraph:workflow)
    - Skill(workflow-authoring)
  prompt: |-
    Please orchestrate this read-only release assessment with subagents.
    Partition the accepted work by the actual parser and documentation domains rather than a domain-by-phase staffing matrix.
    Have one worker assess the parser domain and another independently assess the documentation domain.
    Each returns only keyed decisions, supporting evidence, and remaining requirements for that domain.
    Begin with a one-phase Workflow for the assessments because reconciliation is an expected follow-up phase.
    After accepting both actual results, append a phase with a third worker to reconcile the release decision.
    Preserve the earlier prompts, options, labels, and arguments, and use supported same-session resume so valid completed calls can cache-hit.
    Do not cancel valid running work to edit it, poll for progress, or add speculative work while only callbacks remain.
    Read returned results before deciding the next action.
    Use no more than these three workers and do not repeat complete-unit review for each domain or phase.
    Required checks must pass, and confirmed defects in required behavior block integration.
    A newly accepted current-unit improvement can wait only if it has a tracked follow-up before integration.
    Parser findings: the required test fails, a required feature is absent, and an accepted optional refactor in this unit has no tracked issue.
    Documentation findings: an optional typo already has a tracked issue, and a suspected security defect was disproved.
    The independently verified documentation unit passes all its required checks and acceptance.
    A severe unrelated pre-existing defect remains open without a new tracker record and is not a dependency or gate for that unit.
    The following tracker record is synthetic and covers the optional documentation typo.
    Evidence: The sample guide says "instalation".
    Scope: Correct that spelling in the sample guide.
    Acceptance criteria: The spelling is corrected and Markdown lint passes.
    Owner: docs-maintainer.
    Next action: Correct the sample guide and run Markdown lint.
    Report only after orchestration shows completed results for both assessments and their reconciliation.
    Report blockers, eligible deferrals, and the remaining action before integration.
    Preserve evidence, scope, acceptance criteria, owner, and next action in reported tracker records and proposed follow-up requirements.
    Keep the assessments and reconciliation concise.
    Do not edit files, run Git commands, or publish anything.
graders:
  - name: workflow-invoked
    type: tool_used
    tool: Workflow
    min: 2
  - name: dependent-results
    type: regex
    target: trace
    pattern: '"workflow_progress":\[[^\n]*?"type":"workflow_agent","index":1,[^\n]*?"state":"done"[^\n]*?"resultPreview":"(?!null"|")[^\n]+?"type":"workflow_agent","index":2,[^\n]*?"state":"done"[^\n]*?"resultPreview":"(?!null"|")[^\n]+?"type":"workflow_agent","index":3,[^\n]*?"state":"done"[^\n]*?"resultPreview":"(?!null"|")'
  - name: release-decision
    type: llm
    focus: trace
    criteria: |-
      Judge the observed trace and final report together.
      Require progress evidence of both completed domain assessments and their completed reconciliation.
      Each assessment returns keyed domain decisions and evidence rather than repeating the whole source or every phase.
      Require the reconciliation to use both actual domain results, not an invented report.
      The first Workflow has one assessment phase because reconciliation is an expected follow-up, not a speculative phase.
      The continuation uses the first run's returned scriptPath and same-session runId while preserving unchanged earlier call prompts, options, labels, and arguments.
      Require actual cache-hit evidence for completed valid assessments rather than repeated live assessment calls or a claimed cache hit.
      Main does not cancel valid running work for script edits or poll while only native callbacks remain.
      Main reads returned results before accepting them or starting the next action.
      The run uses at most three workers without a reviewer-per-domain-per-phase Cartesian fan-out or duplicated complete review.
      Do not accept a completion notification or final claims without progress evidence.
      The final report identifies the failed required test and absent required feature as blockers.
      It excludes the disproved security suspicion as a blocker.
      It requires a tracked issue before deferring the accepted current-unit optional refactor.
      It permits the independently verified second unit to proceed despite the unrelated pre-existing defect.
      It requires no new tracker write for that unrelated defect and does not use severity alone as a gate.
      It defers the documentation typo only when the supplied tracker record supports the decision.
      Require the supplied record to contain evidence, scope, acceptance criteria, a named owner, and a next action.
      Fail if a record field is absent, even when the report does not defer the typo.
      Judge the record by meaning rather than fixed wording.
      The report does not claim integration occurred or that read-only work authorized publication.
