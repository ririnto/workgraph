schema_version: "1.1"
name: agent-fan-out
description: Verify direct Agent fan-out for independent assessments that end in one phase.
runs: 2
execution:
  max_turns: 20
  timeout_seconds: 360
  allowed_tools:
    - Agent
    - Skill(workgraph:main-agent-contract)
    - Skill(workgraph:workflow)
  prompt: |-
    Load Workgraph Main Agent Contract and its Claude reference unless their complete content is already present.
    Please orchestrate a read-only assessment with subagents.
    Give one worker batch A and another worker batch B through parallel host Agent calls.
    Combine their independent results in Main.
    Both assessments end in one phase without any expected dependent follow-up.
    No worker needs another worker's result.
    A finding blocks release if its required timeout is absent.
    Batch A has A1 with no required timeout, A2 with its required timeout, and A3 with its required timeout.
    Batch B has B1 with its required timeout, B2 with no required timeout, and B3 with its required timeout.
    Report only after both workers finish.
    Report the blocker IDs and explain the rule.
    Do not edit files, run Git commands, or publish anything.
graders:
  - name: agents-invoked
    type: tool_used
    tool: Agent
    min: 2
    max: 2
  - name: workflow-not-invoked
    type: tool_used
    tool: Workflow
    min: 0
    max: 0
  - name: fan-out-completed
    type: llm
    focus: trace
    criteria: |-
      Require Main's contract and selected Claude reference before delegation.
      Require two concurrent host Agent calls for the two independent batches.
      Each assessment ends in one phase without an expected dependent follow-up.
      Main uses direct Agent rather than Workflow and does not duplicate the work through another execution path.
      The workers assess separate batches without consuming each other's results.
      Main reads both actual completed results, checks them against the supplied rule and facts, and reports A1 and B2 as the only blockers, correcting a returned misclassification against the supplied facts instead of adopting it.
      It applies the missing required timeout rule and claims no edits or publication.
      A proposed run, missing worker result, permission denial, or report before completion fails this check.
      Judge observed tool results and evidence rather than fixed wording.
