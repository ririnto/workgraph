schema_version: "1.1"
name: background-completion
description: Verify that Main accepts background command output only after native completion.
execution:
  runs: 1
  max_turns: 20
  timeout_seconds: 120
  allowed_tools:
    - Bash
  prompt: |-
    Run this read-only command once as a native background Bash command.
    node -e "setTimeout(() => console.log('WORKGRAPH_BACKGROUND_RESULT=42'), 3000)"
    Report the result only after its actual completion output arrives.
    Do not edit files, run Git commands, or start a polling loop.
graders:
  - name: background-command-started
    type: tool_used
    tool: Bash
    min: 1
    max: 1
  - name: completed-output-accepted
    type: llm
    focus: trace
    criteria: |-
      Inspect the actual command invocation, completion output, and final report.
      The command starts as a native background Bash operation.
      Completion output contains WORKGRAPH_BACKGROUND_RESULT=42 and a successful exit.
      Main reports 42 only after receiving that completed output.
      An idle response that says work remains pending is not an acceptance claim.
      Fail if the trace ends without completed output, even when Main guesses the result correctly.
      Main does not start a polling loop, edit files, or run Git commands.
