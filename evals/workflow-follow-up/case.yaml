schema_version: "1.1"
name: workflow-follow-up
description: Select Workflow for a conditional follow-up and report the completed result for each batch.
runs: 1
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools:
    - Agent
    - Workflow
    - Read
  prompt: |-
    Coordinate two independent read-only batches in one run.
    For each batch, have a worker identify missing required timeouts.
    Dispatch a follow-up worker only for batches with returned findings and have it assess release impact using those findings.
    Batch A has timeouts for A1 and A2. Batch B has a timeout for B1 and none for B2.
    A missing timeout blocks release. Report completed outcomes for both batches.
graders:
  - name: workflow-invoked
    type: tool_used
    tool: Workflow
    min: 1
    max: 1
  - name: conditional-results
    type: llm
    focus: trace
    criteria: |-
      The completed Workflow uses the first result from each batch to decide its follow-up.
      A has no follow-up. B has one follow-up using B2 from the predecessor and identifies it as a release blocker.
      The final report reflects the completed results of both batches.
