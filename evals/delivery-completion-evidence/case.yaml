schema_version: "1.1"
name: delivery-completion-evidence
description: Verify the bundled delivery sample gates a planning-only run on completed predecessors with fail-closed completion evidence.
runs: 1
execution:
  max_turns: 20
  timeout_seconds: 1200
  allowed_tools:
    - Workflow
    - Read
  prompt: |-
    Invoke the registered workgraph:delivery workflow once to assess its bundled workflow documentation and plan a bounded clarification.
    Read skills/workflow/SKILL.md and workflows/delivery.js from the plugin unless already fully loaded.
    Put the absolute paths to docs/workflow-samples.md and workflows/delivery.js in args.task for the stage agents.
    Enable Scope, Explore and Plan. Explicitly skip Implement, Integrate, Sweep, Publish and Review.
    Wait for completion and read the returned task output if backgrounded. Report the observed outcome and phase evidence.
    Make no edits or publications.
graders:
  - name: delivery-workflow-invoked
    type: tool_used
    tool: Workflow
    min: 1
    max: 1
  - name: completion-evidence-recorded
    type: llm
    focus: trace
    criteria: |-
      The trace invokes the bundled workgraph:delivery once with the requested args.skips and obtains its completed output.
      Scope and Explore complete with one evidenced result per scope. Plan runs unless Explore returns a justified no-change decision for every scope.
      An evidenced Explore or Plan no-change outcome may report complete true. Otherwise expect complete false.
      Every successor after a terminal decision is skipped. No implementation, integration, sweep, publication, or review runs.
      The final report matches the observed phase records, publish null, and zero fix rounds. A launch acknowledgment alone fails.
