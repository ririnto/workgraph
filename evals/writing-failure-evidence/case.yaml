schema_version: "1.1"
name: writing-failure-evidence
description: Preserve partial success and distinguish observed errors from unsupported causes.
tags:
  - triggering
runs: 2
execution:
  max_turns: 12
  timeout_seconds: 240
  allowed_tools:
    - Read
    - Skill
  prompt: |-
    Write a concise English status update for each incident using the supplied records.
    Return one labeled paragraph per incident, including the next useful action.
    Do not run commands or edit files.

    Incident A:
    The recorded build exited 0 and produced the expected bundle.
    The recorded authentication smoke test exited 1: expected HTTP 200, received HTTP 401.
    Request headers and server logs have not been inspected.
    No repair or rerun has occurred.

    Incident B:
    The recorded export command exited 1 with `OUTPUT_DIR is not set`.
    The recorded environment inspection confirmed that OUTPUT_DIR was absent.
    The exporter checks this variable before creating any files, and no export was produced.
    No configuration change or rerun has occurred.
graders:
  - name: writing-loaded
    type: llm
    arm: with-only
    focus: trace
    criteria: |-
      Require actual loading of the bundled Writing skill before the status updates.
      Accept a successful Skill result for workgraph:writing or a complete Read of skills/writing/SKILL.md from this plugin.
      Accept complete Writing content already supplied in the observed context.
      Reject a mention, description, unsuccessful call, or unsupported loading claim.
  - name: failure-evidence-preserved
    type: llm
    focus: last_message
    criteria: |-
      Require one concise English paragraph for each incident without fixed wording.
      Incident A preserves the successful build and the separate authentication test failure with HTTP 401.
      It leaves the cause unresolved and gives a relevant diagnostic step, such as inspecting the request or server logs.
      Fail an asserted missing header, expired token, configuration fault, or other unsupported cause or definitive repair.
      Clearly labeled hypotheses are allowed if they do not displace the observed failure and next diagnostic.
      Incident B identifies the confirmed missing OUTPUT_DIR and proposes setting an appropriate output directory before rerunning.
      It preserves that no export was produced.
      Neither update claims that the assistant ran the commands, applied a repair, or observed a successful rerun.
      The confirmed cause in Incident B should not be treated as unknown merely because Incident A is unresolved.
  - name: no-file-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-file-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-shell-command
    type: tool_used
    tool: Bash
    min: 0
    max: 0
