schema_version: "1.1"
name: workflow-follow-up-required
description: Verify that a required conditional Workflow follow-up uses its predecessor result.
runs: 2
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools:
    - Agent
    - Workflow
    - Read
    - Skill(workgraph:workflow)
  prompt: |-
    Load Workgraph's Workflow skill unless its complete content is already present.
    Please orchestrate a read-only timeout assessment with delegated workers.
    The follow-up dispatch decision must be made inside the same orchestration from the first worker's returned findings, not by Main separately after that worker returns.
    Have one worker check whether C1, C2, or C3 lacks a required timeout.
    If that worker finds a missing timeout, have a follow-up worker use its actual findings to assess release impact.
    If no timeout is missing, do not dispatch the follow-up worker.
    Input facts: C1 and C3 have required timeouts, while C2 has no required timeout.
    A missing required timeout blocks release.
    Assess only these supplied facts.
    No project files or additional evidence exist.
    Read each returned result before deciding the next action, and report only completed outcomes.
    Report the blocker IDs and whether the follow-up was needed.
    Do not edit files, run Git commands, or publish anything.
graders:
  - name: workflow-invoked
    type: tool_used
    tool: Workflow
    min: 1
  - name: required-follow-up-completed
    type: llm
    focus: trace
    criteria: |-
      Inspect the actual Workflow script, completed worker results, and final report.
      The first worker completes its assessment and returns C2 as the only missing timeout.
      Follow-up dispatch is conditional on that returned result.
      One follow-up worker receives the actual predecessor findings and confirms C2 blocks release.
      Both worker outcomes are complete before Main accepts the release assessment.
      The final report identifies C2 as the only blocker and says the follow-up was required.
      Fail for missing results, a pending worker, or a report that fabricates completion.
      The session does not edit files, run Git commands, or publish anything.
