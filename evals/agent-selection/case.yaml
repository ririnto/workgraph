schema_version: "1.1"
name: agent-selection
description: Verify that Main uses Agent for one bounded assessment.
runs: 2
execution:
  max_turns: 20
  timeout_seconds: 360
  allowed_tools:
    - Agent
    - Workflow
    - Read
  prompt: |-
    ultracode
    Read the bundled `skills/main-agent-contract/SKILL.md` and its `references/claude-code.md` unless their complete content is already present.
    The `Skill` tool refuses Workgraph skills, which is expected.
    Delegate one bounded read-only assessment that ends in one phase to a worker.
    The assessment is complete in this phase, with no expected follow-up phase.
    Do not add preparation, verification, or reporting phases merely to make Workflow eligible.
    Give that worker both batches and report its result in Main.
    A finding blocks release if its required timeout is absent.
    Batch A has A1 without a timeout, A2 with a timeout, and A3 with a timeout.
    Batch B has B1 with a timeout, B2 without a timeout, and B3 with a timeout.
    Report only the blocker IDs and explain the rule.
    Do not edit files, run Git commands, or publish anything.
graders:
  - name: agents-invoked
    type: tool_used
    tool: Agent
    min: 1
    max: 1
  - name: workflow-not-invoked
    type: tool_used
    tool: Workflow
    min: 0
    max: 0
  - name: blockers-reported
    type: llm
    focus: trace
    criteria: |-
      Require the complete bundled Main contract and selected Claude reference to be loaded before delegation.
      Accept complete Reads of the bundled files or complete content already supplied in the observed context.
      Require one completed Agent assessment that receives both batches and applies the timeout rule.
      The assessment is single-phase work with no expected follow-up phase, so Main uses direct Agent rather than Workflow despite the ultracode keyword.
      Main must use that worker's actual result to identify the blockers.
      An irrelevant Agent call, missing worker result, or report before completion fails this check.
      The final report identifies A1 and B2 as the only blockers.
      It applies the missing required timeout rule to both independent batches.
      It does not claim files were edited or a release was published.
