name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Validate Claude plugin package
        run: >-
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.305 -- claude plugin validate --strict ./
      - name: Validate Claude plugin manifest
        run: >-
          npm exec --yes --package=@anthropic-ai/claude-code@2.1.305 -- claude plugin validate --strict .claude-plugin/plugin.json
  macos:
    name: macOS hooks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: node --test hooks/*.test.mjs
  node26:
    name: Node.js 26 hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - run: node --test hooks/*.test.mjs
