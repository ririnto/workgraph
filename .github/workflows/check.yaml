name: Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.1.1
        with:
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
  macos:
    name: macOS hooks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: node --test hooks/*.test.mjs
  node18:
    name: Node.js 18 hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: node --test hooks/*.test.mjs
