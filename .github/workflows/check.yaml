name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
          cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |-
            go.sum
            go.work.sum
            skills/development/assets/golang/go.sum
            skills/development/assets/golang/example/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install ShellCheck
        shell: bash
        run: |-
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Validate Claude plugin package and manifest
        run: pnpm run validate:claude
  macos:
    name: macOS hooks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
      - run: pnpm run test:hooks
        env:
          pnpm_config_verify_deps_before_run: "false"
